<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Facebook Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="image/logo.jpg" alt="Facebook" class="logo">
  </header>

  <main>
    <div class="left">
      <h1>Facebook giúp bạn kết nối và chia sẻ với mọi người trong cuộc sống của bạn.</h1>
      <p>Kết nối với bạn bè, gia đình và những người bạn biết.</p>
    </div>
    <div class="right">
      <form>
        <input type="text" name="email" placeholder="Email hoặc số điện thoại">
        <input type="password" name="password" placeholder="Mật khẩu">
        <button type="submit">Đăng nhập</button>
        <a href="#">Quên mật khẩu?</a>
        <hr>
        <button type="button" class="create-account">Tạo tài khoản mới</button>
      </form>
    </div>
  </main>

  <footer>
  </footer>
</body>
</html>
